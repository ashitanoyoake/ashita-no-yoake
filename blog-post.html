<body>
  <header class="site-header">
    <div class="layout-inner header-inner">
      <p class="site-logo">
        <a href="index.html">
          <img src="images/favicon.png" alt="" class="site-logo-icon" width="32" height="32">
          あしたの夜明け.com
        </a>
      </p>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="メニューを開く">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>

      <nav class="site-nav" id="site-nav" aria-label="メインナビゲーション">
        <ul class="nav-list">
          <li><a href="index.html">ホーム</a></li>
          <li><a href="instagram.html">イラスト</a></li>
          <li><a href="blog.html" aria-current="page">ブログ</a></li>

        </ul>
      </nav>
    </div>
  </header>

  <main class="content-inner page-main">
    <div class="blog-layout">
      <div class="blog-main" data-blog-post-root>
        <article class="blog-post" hidden>
          <p class="blog-post-back">
            <a href="blog.html" class="blog-post-back-link">← ブログ一覧へ戻る</a>
          </p>
          <header class="blog-post-header">
            <time class="blog-post-date blog-date"></time>
            <span class="blog-post-category blog-category"></span>
            <h1 class="blog-post-title"></h1>
            <ul class="blog-post-tags" hidden></ul>
            <img class="blog-post-thumb" alt="" width="480" height="270" hidden>
          </header>
          <div class="blog-post-body"></div>
        </article>
        <p class="blog-post-message">読み込み中...</p>
      </div>

      <aside class="blog-sidebar" aria-label="ブログサイドバー">
        <section class="blog-widget blog-widget-recent">
          <h2 class="blog-widget-title">最近の記事</h2>
          <ul class="blog-recent-list" aria-live="polite"></ul>
        </section>

        <section class="blog-widget blog-widget-categories">
          <h2 class="blog-widget-title">カテゴリ</h2>
          <p class="blog-post-sidebar-note">
            <a href="blog.html">ブログ一覧でカテゴリを見る →</a>
          </p>
        </section>

        <section class="blog-widget blog-widget-profile">
          <h2 class="blog-widget-title">プロフィール</h2>
          <img
            src="images/profile.jpg"
            alt="あしたの夜明けのプロフィール画像"
            class="blog-profile-avatar"
            width="56"
            height="56"
          >
          <p class="blog-profile-text">映画やイラスト、ガンプラ、多肉植物など、好きなことを楽しみながらAIやWeb制作にも挑戦しています。</p>
          <a href="index.html#intro-heading" class="blog-profile-link">自己紹介を見る →</a>
        </section>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="layout-inner footer-inner">
      <p class="footer-brand">あしたの夜明け.com</p>
      <p class="footer-copy">&copy; 2026 あしたの夜明け.com</p>
